<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestión de Pedidos{% endblock %}</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #e2e8f0;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --danger-color: #dc2626;
            --success-color: #16a34a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 900px;
        }

        .top-navbar {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .user-info {
            font-weight: 600;
            color: #0f172a;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-nav {
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 14px;
            border-radius: 6px;
        }

        .btn-categories {
            background-color: #f1f5f9;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
        }

        .btn-admin {
            background-color: #fef3c7;
            color: #d97706;
            border: 1px solid #fde68a;
        }

        .btn-logout {
            background-color: #fef2f2;
            color: var(--danger-color);
        }

        .container {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="top-navbar">
            <span class="user-info">🍽️ {{ restaurante_nombre|default:"Restaurante" }}</span>
            <div class="nav-links">
                <a href="{% url 'listar_categorias' %}" class="btn-nav btn-categories">📁 Ver Categorías</a>
                
                <!-- EJERCICIO 1: Enlace exclusivo para rol 'admin' -->
                {% if request.session.usuario_rol == 'admin' %}
                    <a href="{% url 'panel_administracion' %}" class="btn-nav btn-admin"> Administración</a>
                {% endif %}

                <a href="{% url 'logout_restaurante' %}" class="btn-nav btn-logout">Cerrar Sesión</a>
            </div>
        </div>

        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
